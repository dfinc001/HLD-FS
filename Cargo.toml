[package]
name = "hld-fs"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI arguments
clap = { version = "4", features = ["derive"] }

# Daemon mode
daemonize = "0.5"

# Async runtime & concurrency
tokio = { version = "1.38", features = ["full"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Cryptography & hashing (for 128 KB chunk fingerprinting)
blake3 = "1.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Filesystem in Userspace (FUSE) & OS bindings
fuser = "0.14"
libc = "0.2"

# Serialization / zero-copy parsing (optional for metadata snapshots)
zerocopy = "0.7"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
